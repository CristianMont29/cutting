<script>
/* ===== UTILITÁRIOS ===== */
const $=s=>document.querySelector(s),MEALS=['Café da Manhã','Almoço','Lanche','Janta','Ceia'];
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

const toUTC=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)};
const addDias=(s,n)=>{const d=new Date(toUTC(s)+n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const difDias=(a,b)=>Math.round((toUTC(b)-toUTC(a))/864e5),br=s=>s.split('-').reverse().join('/');
const hojeStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
/* ===== ESTADO ===== */
const F0=[['Peito de frango grelhado','100g',159,32,0,2.5],['Coxa de frango sem pele cozida','100g',175,27,0,7],['Patinho moído cozido','100g',219,35.9,0,7.3],['Tilápia grelhada','100g',128,26,0,2.7],['Salmão grelhado','100g',206,22,0,12],['Atum em conserva (água)','100g',116,26,0,.8],['Ovo cozido','un',73,6.6,.3,4.8],['Clara de ovo','un',17,3.6,.2,.1],['Arroz branco cozido','100g',128,2.5,28.1,.2],['Arroz integral cozido','100g',124,2.6,25.8,1],['Feijão carioca cozido','100g',76,4.8,13.6,.5],['Macarrão cozido','100g',102,3.4,19.9,.5],['Batata doce cozida','100g',77,.6,18.4,.1],['Batata inglesa cozida','100g',52,1.2,11.9,0],['Mandioca cozida','100g',125,.6,30.1,.3],['Pão francês','un',150,4,29.3,1.5],['Pão integral de forma (fatia)','un',65,2.5,12,.9],['Aveia em flocos','100g',394,13.9,66.6,8.5],['Whey protein','scoop',120,24,3,1.5],['Iogurte natural desnatado','100g',41,3.8,5.8,.3],['Iogurte grego natural','100g',97,9,4,5],['Leite desnatado','100g',35,3.4,4.9,.1],['Queijo cottage','100g',98,11,3.4,4.3],['Queijo minas frescal','100g',264,17.4,3.2,20.2],['Banana prata','100g',98,1.3,26,.1],['Maçã','100g',56,.3,15.2,0],['Mamão papaia','100g',40,.5,10.4,.1],['Laranja','100g',37,1,8.9,.1],['Morango','100g',30,.9,6.8,.3],['Abacate','100g',96,1.2,6,8.4],['Brócolis cozido','100g',25,2.1,4.4,.5],['Alface','100g',11,1.3,1.7,.2],['Tomate','100g',15,1.1,3.1,.2],['Cenoura cozida','100g',30,.8,6.7,.2],['Azeite de oliva (colher de sopa)','un',117,0,0,13.5],['Pasta de amendoim (colher de sopa)','un',94,3.8,3,8],['Castanha-do-pará','un',26,.6,.5,2.6],['Paçoca','un',80,2.5,8.5,4.2]];
const padrao=()=>({v:1,onb:false,perfil:{sexo:'M',idade:30,altura:175,pesoIni:85,pesoRef:85,pesoMeta:78,inicio:'2026-10-07',ativ:1.55,deficit:20,prot:2,gord:.8,manual:null,passos:8000,sono:7.5},
foods:F0.map((f,i)=>({id:'f'+(i+1),n:f[0],un:f[1],k:f[2],p:f[3],c:f[4],g:f[5]})),log:[],ci:{}});
let S=padrao(),UI={tab:'hoje',date:hojeStr(),meal:mealH(),sel:null,fid:null,undo:null};
function mealH(){const h=new Date().getHours();return h<10?MEALS[0]:h<14?MEALS[1]:h<17?MEALS[2]:h<21?MEALS[3]:MEALS[4]}
/* ===== CÁLCULOS PUROS ===== */
function calcItem(f,q){if(!f)return{k:0,p:0,c:0,g:0};const m=f.un==='100g'?q/100:q;return{k:f.k*m,p:f.p*m,c:f.c*m,g:f.g*m}}
function calcMetas(pf){const tmb=10*pf.pesoRef+6.25*pf.altura-5*pf.idade+(pf.sexo==='M'?5:-161),tdee=tmb*pf.ativ,calc=tdee*(1-pf.deficit/100),meta=pf.manual>0?pf.manual:Math.round(calc);
const P=Math.round(pf.pesoRef*pf.prot),G=Math.round(pf.pesoRef*pf.gord),C=Math.max(0,Math.round((meta-4*P-9*G)/4)),defDia=tdee-meta,sem=defDia*7/7700;
return{tmb,tdee,calc,meta,P,G,C,defDia,sem,pct:sem/pf.pesoRef*100,defPct:(1-meta/tdee)*100,agua:Math.round(pf.pesoRef*.035*10)/10}}
const fmap=()=>Object.fromEntries(S.foods.map(f=>[f.id,f]));
function totDia(s,d){const fm=Object.fromEntries(s.foods.map(f=>[f.id,f])),t={k:0,p:0,c:0,g:0,n:0,meals:{}};for(const r of s.log){if(r.d!==d)continue;const x=calcItem(fm[r.f],r.q);t.k+=x.k;t.p+=x.p;t.c+=x.c;t.g+=x.g;t.n++;t.meals[r.m]=(t.meals[r.m]||0)+x.k}return t}
const statusKcal=(k,meta)=>k<=0?'Sem registro':k>meta?'Acima da meta':'Dentro da meta';
const datasReg=s=>[...new Set(s.log.map(r=>r.d))].sort();
function mediaPeso(ci,d,a=-6){const v=[];for(let i=a;i<=0;i++){const x=ci[addDias(d,i)];if(x&&x.peso>0)v.push(x.peso)}return avg(v)}
function pesoAtual(s){const ds=Object.keys(s.ci).filter(d=>s.ci[d].peso>0).sort();if(!ds.length)return{p:s.perfil.pesoIni,d:null};const L=ds[ds.length-1];return{p:mediaPeso(s.ci,L),d:L}}
function linhasResumo(s){const m=calcMetas(s.perfil),ds=datasReg(s),tk={};ds.forEach(d=>tk[d]=totDia(s,d));let ac=0;const rows=[];
for(const d of ds){const t=tk[d];if(t.k<=0)continue;const w=ds.filter(x=>x>=addDias(d,-6)&&x<=d&&tk[x].k>0).map(x=>tk[x].k),def=m.tdee-t.k;ac+=def;
rows.push({d,meta:m.meta,k:t.k,saldo:m.meta-t.k,p:t.p,c:t.c,g:t.g,mp:m.P,st:statusKcal(t.k,m.meta),pok:t.p>=m.P,m7:avg(w),def,ac,fat:ac/7700})}return rows.reverse()}
function ciMed(s,campo,a,b){const v=[];for(let d=a;d<=b;d=addDias(d,1)){const x=s.ci[d];if(x&&x[campo]>0)v.push(x[campo])}return avg(v)}
function semanas(s,ref){const m=calcMetas(s.perfil),out=[];let prev=s.perfil.pesoIni;for(let n=0;n<60;n++){const i=addDias(s.perfil.inicio,7*n),f=addDias(i,6);if(i>ref)break;
const dias=[];for(let d=i;d<=f;d=addDias(d,1)){const t=totDia(s,d);if(t.k>0)dias.push(t)}const ok=dias.filter(t=>t.k<=m.meta).length,pOk=dias.filter(t=>t.p>=m.P).length,mk=avg(dias.map(t=>t.k)),pm=ciMed(s,'peso',i,f);
let tr=0;for(let d=i;d<=f;d=addDias(d,1))if(s.ci[d]&&s.ci[d].treino)tr++;
const defv=dias.reduce((a,t)=>a+m.tdee-t.k,0);out.push({i,f,n:dias.length,mk,meta:m.meta,ok,ad:dias.length?ok/dias.length*100:null,pOk,def:defv,fat:defv/7700,pm,vr:pm!=null?pm-prev:null,ag:ciMed(s,'agua',i,f),ps:ciMed(s,'passos',i,f),so:ciMed(s,'sono',i,f),tr});if(pm!=null)prev=pm}return out}
function kpis(s,ref){const m=calcMetas(s.perfil),pf=s.perfil,pa=pesoAtual(s),a=addDias(ref,-6),rows=linhasResumo(s),r7=rows.filter(r=>r.d>=a&&r.d<=ref);
const ds=datasReg(s).filter(d=>totDia(s,d).k>0),ok=rows.filter(r=>r.k<=m.meta).length,sem=pa.d?Math.max(1,difDias(pf.inicio,pa.d))/7:null,rit=sem?(pf.pesoIni-pa.p)/sem:null;
let treinos=0;for(let d=a;d<=ref;d=addDias(d,1))if(s.ci[d]&&s.ci[d].treino)treinos++;
const prev=rit>0&&pa.p>pf.pesoMeta?addDias(pa.d||ref,Math.round((pa.p-pf.pesoMeta)/rit*7)):null;
return{m,pa,rit,prev,dias:ds.length,m7:avg(r7.map(r=>r.k)),p7:avg(r7.map(r=>r.p)),ad:rows.length?ok/rows.length*100:null,ac:rows.length?rows[0].ac:0,fat:rows.length?rows[0].fat:0,ag:ciMed(s,'agua',a,ref),ps:ciMed(s,'passos',a,ref),so:ciMed(s,'sono',a,ref),treinos,imc:pa.p/Math.pow(pf.altura/100,2)}}
function diagnostico(K,pf){const m=K.m,o=[],L=(ok,t)=>o.push([ok,(ok?'OK – ':'ATENÇÃO – ')+t]);
if(K.m7==null)L(false,'sem registros de alimentação nos últimos 7 dias.');else L(K.m7<=m.meta,`média de ${nf(K.m7,0)} kcal/dia contra meta de ${nf(m.meta,0)}.`);
if(K.p7==null)L(false,'sem dados de proteína.');else L(K.p7>=.9*m.P,`proteína média de ${nf(K.p7,0)} g (meta ${nf(m.P,0)} g).`);
if(K.rit==null)L(false,'sem pesagens para calcular o ritmo.');else{const p=K.rit/K.pa.p*100;L(p>=.25&&p<=1,p>1?`perda rápida (${nf(p,2)}%/sem): risco de perder massa magra.`:p<.25?`perda lenta (${nf(p,2)}%/sem).`:`ritmo ideal (${nf(p,2)}% do peso/sem).`)}
if(K.ad==null)L(false,'sem dados de aderência.');else L(K.ad>=80,K.ad>=80?`aderência de ${nf(K.ad,0)}%.`:K.ad>=60?`aderência moderada (${nf(K.ad,0)}%).`:`aderência baixa (${nf(K.ad,0)}%).`);
const f=[];if(K.ag!=null&&K.ag<m.agua)f.push('água');if(K.ps!=null&&K.ps<pf.passos)f.push('passos');if(K.so!=null&&K.so<pf.sono)f.push('sono');if(K.treinos<3)f.push('treinos');
L(f.length===0&&K.ag!=null,f.length?'abaixo do ideal em: '+f.join(', ')+'.':'hábitos dentro do esperado ou sem registro.');return o}
/* ===== PERSISTÊNCIA ===== */
const KEY='cutting_v1';
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){console.warn(e)}}
function carregar(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.perfil&&o.foods&&o.log&&o.ci)S=Object.assign(padrao(),o)}}catch(e){console.warn(e)}}
function baixar(nome,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;a.click()}
function exemplo(){S=padrao();S.onb=true;let s=7;const rng=()=>(s=(s*16807)%2147483647)/2147483647,F=n=>S.foods.find(f=>f.n===n).id;
for(let i=0;i<14;i++){const d=addDias('2026-10-07',i),f=.9+rng()*.3,add=(m,n,q)=>S.log.push({id:uid(),d,m,f:F(n),q:Math.round(q)});
add(MEALS[0],'Ovo cozido',2);add(MEALS[0],'Pão francês',1);add(MEALS[0],'Banana prata',100);add(MEALS[1],'Arroz branco cozido',200*f);add(MEALS[1],'Feijão carioca cozido',150);add(MEALS[1],'Peito de frango grelhado',200*f);add(MEALS[1],'Brócolis cozido',100);add(MEALS[1],'Azeite de oliva (colher de sopa)',1);
add(MEALS[2],'Whey protein',1);add(MEALS[2],'Pasta de amendoim (colher de sopa)',1);add(MEALS[3],'Patinho moído cozido',150*f);add(MEALS[3],'Batata doce cozida',200*f);add(MEALS[3],'Tomate',100);
if(i%3==1){add(MEALS[4],'Paçoca',2);add(MEALS[3],'Macarrão cozido',200)}if(i%5==2)add(MEALS[3],'Pão francês',2);
S.ci[d]={peso:(i==4||i==9)?null:Math.round((85-.07*i+(rng()-.5)*.5)*10)/10,cintura:null,agua:Math.round((2+rng()*1.5)*10)/10,passos:Math.round(6000+rng()*6000),sono:Math.round((6+rng()*2)*10)/10,treino:rng()>.4}}
S.perfil.inicio='2026-10-07';UI.date='2026-10-20';salvar();render()}
/* ===== RENDERIZAÇÃO ===== */
const R={};let CH={};
const uL=f=>!f?'':f.un==='100g'?'g':f.un;
function toast(msg,undo){const t=$('#toast');t.innerHTML=esc(msg)+(undo?'<button data-a="undo">Desfazer</button>':'');UI.undo=undo||null;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',5000)}
const barra=(l,v,mt,tp)=>{const pc=mt>0?Math.min(100,v/mt*100):0,cl=tp==='p'?(v<mt?'warn':'ok'):(v>mt?'bad':'ok');return `<div class="bar"><div class="bl"><span>${l}</span><span>${nf(v,l==='Calorias'?0:1)} / ${nf(mt,0)}</span></div><div class="bt"><i class="${cl}" style="width:${pc}%"></i></div></div>`};
const TABS=[['hoje','Hoje'],['resumo','Resumo'],['relatorio','Relatório'],['checkin','Check-in'],['alimentos','Alimentos'],['perfil','Perfil'],['backup','Backup']];
function render(){$('#nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-id="${t[0]}" class="${UI.tab===t[0]?'on':''}">${t[1]}</button>`).join('');
$('#app').innerHTML=R[UI.tab]()+`<footer>Estimativas gerais (Mifflin-St Jeor e ~7.700 kcal/kg). Não substitui acompanhamento de nutricionista ou médico. Valores dos alimentos são aproximados: confira os rótulos.</footer>`;
if(UI.tab==='relatorio')graficos();if(UI.tab==='hoje'&&UI.pend){const f=S.foods.find(x=>x.id===UI.pend);UI.pend=null;if(f){pick(f.id);$('#qt').focus()}}}
R.hoje=()=>{const d=UI.date,m=calcMetas(S.perfil),t=totDia(S,d),fm=fmap();
let lst='';MEALS.forEach(ml=>{const rs=S.log.filter(r=>r.d===d&&r.m===ml);if(!rs.length)return;let sub=0;
const li=rs.map(r=>{const f=fm[r.f],x=calcItem(f,r.q);sub+=x.k;return `<li class="${f?'':'bad'}"><span><b>${f?esc(f.n):'Alimento removido'}</b> ${nf(r.q,r.q%1?1:0)} ${uL(f)}<small>${nf(x.k,0)} kcal · P ${nf(x.p)} · C ${nf(x.c)} · G ${nf(x.g)}</small></span><span><button data-a="edit" data-id="${r.id}">Editar</button> <button data-a="del" data-id="${r.id}">Excluir</button></span></li>`}).join('');
lst+=`<h3>${ml} <small>${nf(sub,0)} kcal</small></h3><ul class="li">${li}</ul>`});
const rec=[],vis=new Set();for(let i=S.log.length-1;i>=0&&rec.length<8;i--){const r=S.log[i];if(!vis.has(r.f)&&fm[r.f]){vis.add(r.f);rec.push(r)}}
